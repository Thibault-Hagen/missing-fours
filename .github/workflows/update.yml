name: Rebuild data and publish

# Downloads the SEC's XBRL archive, rebuilds every company's unrounded EPS,
# stores the results on the `data` branch, and republishes the site.

on:
  schedule:
    # Saturdays at 6:41 am Chicago time, after the week's 10-Q and 10-K filings
    - cron: "41 11 * * 6"
  workflow_dispatch:
    inputs:
      keep_facts:
        description: "Also save the extracted SEC facts to the facts branch"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the one optional dependency (faster JSON)
        run: pip install orjson

      - name: Extract EPS facts from the SEC's XBRL data
        env:
          SEC_USER_AGENT: "The Missing Fours research project HagenThibault@gmail.com"
        run: python pipeline/extract.py

      - name: Save extracted facts to the facts branch
        if: inputs.keep_facts
        run: |
          mkdir -p /tmp/facts
          cp build/facts.jsonl.gz pipeline/cache/*.json /tmp/facts/
          cd /tmp/facts
          git init -q -b facts
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Extracted EPS facts $(date -u +%Y-%m-%d)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" facts

      - name: Rebuild unrounded EPS and the statistics
        run: python pipeline/analyze.py

      - name: Publish the results to the data branch
        run: |
          cd site/data
          git init -q -b data
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Data rebuilt $(date -u +%Y-%m-%d)"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data

      - name: Save the ticker and company-profile caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/cache
          if git diff --cached --quiet; then
            echo "Caches unchanged"
          else
            git commit -m "Refresh SEC ticker and profile caches"
            git pull --rebase --quiet origin main
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: data
          path: site/data
      - run: rm -rf site/data/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
